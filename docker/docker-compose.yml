version: '3'
services:
  mysql8_orm:
    image: mysql:8.4
    volumes:
      - orm_data_mysql8:/var/lib/mysql
    ports:
      - ${LOCAL_IP}:${MYSQL8_PORT}:3306
    environment:
      MYSQL_ROOT_PASSWORD: root
  redis:
    image: redis:6.2.8
    ports:
      - ${LOCAL_IP}:${REDIS_PORT}:6379
  redis7:
    image: redis:7.0.7
    ports:
      - ${LOCAL_IP}:${REDIS7_PORT}:6379
volumes:
  orm_data_mysql8: {}
